name: AI voice packages

on:
  push:
    tags: ['v*']
  schedule:
    # 03:23 Beijing time; GitHub may delay scheduled runs.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-voice-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Decide whether these inputs already have a nightly
        id: inputs
        env:
          RELEASE_KIND: ${{ github.event_name == 'push' && 'official' || 'nightly' }}
        run: node .github/scripts/ci-inputs.js
      - name: Validate frozen voice inputs
        if: steps.inputs.outputs.build == 'true'
        run: node .github/scripts/check-voice-inputs.js
      - name: Build only the package with AI voices
        if: steps.inputs.outputs.build == 'true'
        shell: pwsh
        run: ./build.ps1
      - name: Publish package and checksum
        if: steps.inputs.outputs.build == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          INPUT_FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
          RELEASE_KIND: ${{ github.event_name == 'push' && 'official' || 'nightly' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'pack/with_audio/RedAlert2-AIVoice-zh_hans.zip'
          $checksum = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Missing voice package' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RedAlert2-AIVoice-zh_hans.zip" | Set-Content -LiteralPath $checksum -Encoding utf8
          $notes = "Source commit: $env:GITHUB_SHA`nBuild inputs: $env:INPUT_FINGERPRINT`nContains AI voices."
          if ($env:RELEASE_KIND -eq 'nightly') {
            gh release create $env:RELEASE_TAG $zip $checksum --target $env:GITHUB_SHA --prerelease --latest=false --title "AI Voice Nightly $env:RELEASE_TAG" --notes $notes
          } else {
            gh release create $env:RELEASE_TAG $zip $checksum --verify-tag --title $env:RELEASE_TAG --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing assets were not overwritten' }
